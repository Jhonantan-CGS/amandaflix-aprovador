<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>AmandaFlix Aprovador</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d14;
      --panel: #111827;
      --panel-soft: #172033;
      --text: #f8fafc;
      --muted: #9ca3af;
      --line: #253044;
      --accent: #e50914;
      --ok: #22c55e;
      --bad: #ef4444;
      --warn: #f59e0b;
    }

    * { box-sizing: border-box; }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-card {
      width: min(420px, 100%);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(17, 24, 39, .96), rgba(23, 32, 51, .94));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
    }

    .profile {
      display: grid;
      justify-items: center;
      gap: 10px;
      margin-bottom: 18px;
      text-align: center;
    }

    .profile img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      object-fit: cover;
      border: 2px solid rgba(229, 9, 20, .42);
      box-shadow: 0 18px 42px rgba(0, 0, 0, .34);
    }

    .profile strong {
      font-size: 24px;
      line-height: 1.1;
    }

    .profile span {
      color: var(--muted);
      font-size: 14px;
    }

    .login-form {
      display: grid;
      gap: 10px;
    }

    .login-form label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .login-form input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b1220;
      color: var(--text);
      padding: 0 12px;
      font-size: 17px;
      outline: none;
    }

    .login-form input:focus {
      border-color: rgba(229, 9, 20, .72);
      box-shadow: 0 0 0 3px rgba(229, 9, 20, .16);
    }

    .login-error {
      min-height: 18px;
      color: #fca5a5;
      font-size: 13px;
    }

    .login-button {
      background: var(--accent);
    }

    main {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 18px 14px 36px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 2px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.12;
    }

    .status {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .install {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      color: var(--text);
      padding: 0 12px;
      font-weight: 700;
      display: none;
    }

    .mascot {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(229, 9, 20, .14), rgba(23, 32, 51, .82));
    }

    .mascot img {
      width: 82px;
      height: 82px;
      border-radius: 14px;
      object-fit: cover;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .34);
      animation: mascotFloat 2.8s ease-in-out infinite;
    }

    .mascot strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .mascot span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .request {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .title {
      font-size: 17px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      color: white;
      padding: 0 14px;
      font-size: 15px;
      font-weight: 800;
    }

    .approve { background: var(--ok); }
    .reject { background: var(--bad); }

    .empty {
      color: var(--muted);
      padding: 16px;
      background: var(--panel-soft);
      border-radius: 8px;
      text-align: center;
    }

    .history {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .history li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 10px;
      background: var(--panel-soft);
      border-radius: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .pill {
      font-weight: 800;
      color: var(--text);
    }

    .approved { color: #86efac; }
    .rejected { color: #fca5a5; }
    .pending { color: #fde68a; }

    @keyframes mascotFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.025); }
    }

    @media (max-width: 700px) {
      .request {
        grid-template-columns: 1fr;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      header {
        align-items: flex-start;
      }

      .mascot {
        grid-template-columns: 64px 1fr;
      }

      .mascot img {
        width: 64px;
        height: 64px;
      }
    }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <form class="login-card" id="loginForm" autocomplete="off">
      <div class="profile">
        <img src="./dayane-profile.jpg" alt="Perfil Dayane">
        <strong>Dayane</strong>
        <span>Acesso familiar ao AmandaFlix Aprovador</span>
      </div>
      <div class="login-form">
        <label for="passwordInput">Senha do aprovador</label>
        <input id="passwordInput" type="password" inputmode="text" autocomplete="current-password" placeholder="Digite a senha">
        <div class="login-error" id="loginError" role="alert"></div>
        <button class="login-button" type="submit">Entrar</button>
      </div>
    </form>
  </div>

  <main id="appShell" hidden>
    <header>
      <div class="brand">
        <img src="./icon.png" alt="AmandaFlix">
        <div>
          <h1>AmandaFlix Aprovador</h1>
          <div class="status" id="status">Conectando ao Firebase...</div>
        </div>
      </div>
      <button class="install" id="installButton">Instalar</button>
    </header>

    <div class="mascot">
      <img src="./amanda-loading.jpg" alt="AmandaFlix aguardando aprovacao">
      <div>
        <strong>A Amanda foi tirar o leite da vaca.</strong>
        <span>Quando uma solicitacao chegar, aprove ou rejeite para controlar a sessao.</span>
      </div>
    </div>

    <section>
      <h2>Solicitacoes pendentes</h2>
      <div class="grid" id="pending"></div>
    </section>

    <section>
      <h2>Ultimas decisoes</h2>
      <ul class="history" id="history"></ul>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
